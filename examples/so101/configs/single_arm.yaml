# One SO-101 follower + a third-person scene camera + a wrist camera.
#
# Fill in the `port`, `calibration_id` and camera `device` fields for your
# setup. `uv run so101_client.py cameras` lists what's plugged in.

server: http://127.0.0.1:8101     # host_server_so101.py (./run_so101.sh)
prompt: pick up the red block and put it in the bowl   # default; --prompt overrides

exec_hz: 30              # rate joint targets are sent to the servos
num_steps: 10            # flow-matching solver steps
ensemble_m: 0.5          # temporal-ensembling decay (1/s); lower = smoother, laggier
smooth_alpha: 1.0        # extra EMA on the output (1.0 = off; try 0.6 if jittery)
warmup_predictions: 2    # discard the first N chunks per arm (CUDA-graph capture is slow)
hold_torque_on_exit: false   # false = arm goes limp on exit (LeRobot default)

cameras:
  scene:
    # RealSense via pyrealsense2 (colour only). Omit `serial` to take the first one.
    type: realsense
    serial: "935322072168"
    width: 640
    height: 480
    fps: 30
    # To use a plain webcam instead:
    # type: opencv
    # device: /dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_33DAD1BF-video-index0
  wrist:
    type: opencv
    # The standard SO-101 wrist cam. Replace with its by-id path once plugged in.
    device: /dev/v4l/by-id/REPLACE-ME-video-index0
    width: 640
    height: 480
    fps: 30
    flip: "180"          # v | h | 180 | none. Match how the camera is mounted.
    white_balance_temperature: 4600   # pin WB (drift hurts the policy); remove for auto

arms:
  - name: left
    port: /dev/ttyACM0                 # `lerobot-find-port`
    calibration_id: left_follower      # ~/.cache/huggingface/lerobot/calibration/robots/so_follower/<id>.json
    scene_camera: scene
    wrist_camera: wrist
    scene_only: false                  # true = send the scene image twice, ignore the wrist cam

    # LeRobot v3.0 calibration -> MolmoAct2 (v2.1) joint convention.
    # model = signs * arm + offsets. Verify with `so101_client.py check`.
    joint_signs:   [1, -1, 1, 1, 1, 1]
    joint_offsets: [0, 90, 90, 0, 0, 0]

    # Safety. Limits are in the arm's own (LeRobot) degrees; null = no limit.
    max_step_deg: 5.0                  # per 1/exec_hz tick, whole-vector scaled
    max_chunk_jump_deg: 30.0           # drop chunks whose first action is this far from the current pose
    joint_min: [null, null, null, null, null, null]
    joint_max: [null, null, null, null, null, null]
